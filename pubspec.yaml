name: mono_wallet
description: "Enterprise Flutter application following Clean Architecture."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.11.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0

  # Navigation
  go_router: ^17.1.0

  # Model Generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  # Network
  dio: ^5.8.0+1
  connectivity_plus: ^7.1.0
  socket_io_client: ^2.0.3+1

  # Dependency Injection
  get_it: ^9.2.1
  injectable: ^2.5.0

  # Functional Programming
  dartz: ^0.10.1

  # Equatable
  equatable: ^2.0.7

  # Localization utilities
  intl: ^0.20.1

  # Storage
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.3.3

  # Logging
  talker_flutter: ^5.1.16
  talker_dio_logger: ^5.1.16

  # Notifications
  flutter_local_notifications: ^21.0.0

  # HTML rendering
  flutter_html: ^3.0.0

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.1
  video_player: ^2.11.1
  video_compress: ^3.1.3
  firebase_core: ^4.8.0
  cloud_firestore: ^6.4.0
  fluttertoast: ^9.0.0
  shimmer: ^3.0.0
  coverage: ^1.15.0
  flutter_svg: ^2.0.17
  supabase_flutter: ^2.17.2
  supabase: ^2.16.1
  http: ^1.2.0
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.15
  freezed: ^3.2.5
  json_serializable: ^6.9.5
  injectable_generator: ^2.7.0

  # Testing
  mocktail: ^1.0.4
  bloc_test: ^10.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - lib/core/localization/l10n/
    - assets/illustrations/onboarding_hero.svg
